storage: /verdaccio/storage
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 10
uplinks: {}
packages:
  '@ai-supply-chain-fixtures/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
server:
  keepAliveTimeout: 60
log:
  type: stdout
  format: pretty
  level: warn
