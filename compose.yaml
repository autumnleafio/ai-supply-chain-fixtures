services:
  pypi-simple:
    image: python:3.11-slim
    ports:
      - "8080:8080"
    volumes:
      - ./pypi/public:/srv/pypi:ro
    working_dir: /srv/pypi
    command: python -m http.server 8080

  verdaccio:
    image: verdaccio/verdaccio:6.1.6
    ports:
      - "4873:4873"
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage

volumes:
  verdaccio-storage:
